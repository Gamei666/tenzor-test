- name: Add Docker CE repository
  become: true
  ansible.builtin.command: dnf config-manager --add-repo https://download.docker.com/linux/{{ ansible_distribution | lower }}/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo

- name: Install RHEL Dependencies
  become: true
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
